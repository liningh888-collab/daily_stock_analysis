name: 高胜率稳健量化策略
on:
  schedule:
    # 原：北京时间 9:15 → 提前3小时 → 北京时间 6:15 → UTC 22:15（前一天）
    - cron: '15 22 * * 0-4'
    # 原：北京时间 11:30 → 提前3小时 → 北京时间 8:30 → UTC 00:30
    - cron: '30 0 * * 1-5'
    # 原：北京时间 14:45 → 提前3小时 → 北京时间 11:45 → UTC 03:45
    - cron: '45 3 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance
      - name: 运行策略
        env:
          CONFIG_CONTENT: ${{ secrets.CONFIG_CONTENT }}
          TZ: Asia/Shanghai
        run: python main.py
