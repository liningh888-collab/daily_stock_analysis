name: 量化定时推送
on:
  schedule:
    # 北京时间 08:00 = UTC 00:00（原5:40改为8:00）
    - cron: '0 0 * * *'
    # 北京时间 09:00 = UTC 01:00（保持不变）
    - cron: '0 1 * * *'
    # 北京时间 10:00 = UTC 02:00（原15:00改为10:00）
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"  # 新增pip缓存，加速依赖安装

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install requests pandas numpy yfinance pytz ntplib

      - name: 运行策略
        run: python main.py
