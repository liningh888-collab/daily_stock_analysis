name: 量化定时推送
on:
  schedule:
    # 北京时间 5:40  = UTC 前一天 21:40
    - cron: '40 21 * * *'
    # 北京时间 09:00 = UTC 01:00
    - cron: '0 1 * * *'
    # 北京时间 15:00 = UTC 07:00
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install requests pandas numpy yfinance pytz ntplib

      - name: 运行策略
        run: python main.py
