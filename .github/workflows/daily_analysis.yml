name: 高胜率稳健量化策略
on:
  schedule:
    - cron: '20 1 * * 1-5'  # UTC 01:20 = 北京时间 09:20
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance pytz ntplib
      
      - name: 验证北京时间
        env:
          TZ: Asia/Shanghai
        run: |
          echo "当前北京时间：$(date -d 'TZ="Asia/Shanghai"' '+%Y-%m-%d %H:%M:%S')"
      
      - name: 运行策略推送
        env:
          TZ: Asia/Shanghai
        run: python main.py
