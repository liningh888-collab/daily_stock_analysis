name: 高胜率稳健量化策略
on:
  schedule:
    # 北京时间 09:20 早盘选股推送
    - cron: '20 1 * * 1-5'
    # 北京时间 10:00 盘中二次决策推送
    - cron: '00 2 * * 1-5'
    # 北京时间 14:40 尾盘隔夜决策推送
    - cron: '40 6 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance
      - name: 运行策略推送
        env:
          CONFIG_CONTENT: ${{ secrets.CONFIG_CONTENT }}
          TZ: Asia/Shanghai
        run: python main.py
