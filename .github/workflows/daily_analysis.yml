name: 量化定时推送
on:
  schedule:
    # 北京时间 08:00 → 提前10分钟，配置为UTC 23:50（北京时间7:50）
    - cron: '50 23 * * *'
    # 北京时间 09:00 → 提前15分钟，配置为UTC 00:45（北京时间8:45）
    - cron: '45 0 * * *'
    # 北京时间 10:00 → 提前10分钟，配置为UTC 01:50（北京时间9:50）
    - cron: '50 1 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"  # 加速依赖安装，减少运行时间

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install requests pandas numpy yfinance pytz ntplib

      - name: 运行策略
        run: python main.py
