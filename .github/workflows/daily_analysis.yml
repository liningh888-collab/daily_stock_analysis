name: 高胜率稳健量化策略
on:
  schedule:
    - cron: '20 1 * * 1-5'  # ✅ UTC 01:20 = 北京时间 09:20（周一到周五）
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance schedule pytz
      - name: 运行策略推送
        env:
          TZ: Asia/Shanghai  # ✅ 强制时区上海，绝对不会乱
        run: python main.py
